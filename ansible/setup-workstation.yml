        - paperless-db.container
        - paperless-gotenberg.container
        - paperless-tika.container
        - paperless.container
      notify: reload systemd

    - name: Enable and start Paperless-NGX
      systemd:
        name: paperless.service
        daemon_reload: yes
        enabled: yes
        state: started

    # =========================================================
    # 26. Frigate NVR (GPU: NVDEC camera decode + ONNX detector)
    #
    # /etc/containers/frigate/config/config.yml is NOT in git: it holds the camera RTSP
    # credentials. Restore it (plus frigate.db if history matters) before first start;
    # without it Frigate would come up with a default config, so it is only started when
    # the file exists. Recordings go to /mnt/data/frigate on Optimus Prime's NFS export
    # (section 6). Needs the NVIDIA driver and CDI spec (section 5).
    # =========================================================
    - name: Create Frigate config directory
      file:
        path: /etc/containers/frigate/config
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy Frigate quadlet
      copy:
        src: "{{ quadlets_src }}/frigate.container"
        dest: /etc/containers/systemd/frigate.container
        mode: "0644"
      notify: reload systemd

    - name: Check for the Frigate config
      stat:
        path: /etc/containers/frigate/config/config.yml
      register: frigate_config

    - name: Enable and start Frigate
      systemd:
        name: frigate.service
        daemon_reload: yes
        enabled: yes
        state: started
      when: frigate_config.stat.exists

    - name: Report that Frigate needs its config restored
      debug:
        msg: >-
          Frigate NOT started: restore /etc/containers/frigate/config/config.yml
          (camera credentials, not in git), then start frigate.service.
      when: not frigate_config.stat.exists

    # =========================================================
    # 27. GitLab Runner (CI jobs via the host podman socket)
    #
    # config/config.toml is NOT in git: it holds the runner authentication token.
    # Restore it or re-register (`podman exec -it gitlab-runner gitlab-runner register`).
    # Without it the runner starts and idles. runner-cache-cleanup deletes CI cache
    # entries older than 14 days from the runner-*-cache-* volumes, daily.
    # =========================================================
    - name: Create GitLab Runner config directory
      file:
        path: "/home/{{ target_user }}/docker_persistent/gitlab-runner/config"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"

    - name: Deploy GitLab Runner quadlet
      copy:
        src: "{{ quadlets_src }}/gitlab-runner.container"
        dest: /etc/containers/systemd/gitlab-runner.container
        mode: "0644"
      notify: reload systemd

    - name: Enable and start GitLab Runner
      systemd:
        name: gitlab-runner.service
        daemon_reload: yes
        enabled: yes
        state: started

    - name: Deploy runner cache cleanup script
      copy:
        src: "{{ playbook_dir }}/../systemd/system/bumblebee/runner-cache-cleanup.sh"
        dest: /usr/local/bin/runner-cache-cleanup.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy runner cache cleanup service and timer
      copy:
        src: "{{ playbook_dir }}/../systemd/system/bumblebee/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - runner-cache-cleanup.service
        - runner-cache-cleanup.timer
      notify: reload systemd

    - name: Enable runner cache cleanup timer
      systemd:
        name: runner-cache-cleanup.timer
        daemon_reload: yes
        enabled: yes
        state: started

    # =========================================================
    # 28. Podman exporter (Prometheus job podman-bumblebee, :9882)
    # Its firewall port is opened in section 11.
    # =========================================================
    - name: Deploy podman exporter quadlet
      copy:
        src: "{{ quadlets_src }}/podman-exporter.container"
        dest: /etc/containers/systemd/podman-exporter.container
        mode: "0644"
      notify: reload systemd

    - name: Enable and start podman exporter
      systemd:
        name: podman-exporter.service
        daemon_reload: yes
        enabled: yes
        state: started

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
    # Handlers run in definition order, so this follows the daemon reload.
    - name: restart traefik
      systemd:
        name: traefik.service
        state: restarted
    - name: reboot required
      debug:
        msg: "NVIDIA driver installed - a reboot is required for the driver to load. Run 'reboot' when ready."
