---
- name: Setup AlmaLinux 9 workstation (Bumblebee)
  hosts: workstations
  become: yes
  vars:
    target_user: matteo
    nfs_server: "{{ nfs_server | default('192.168.1.10') }}"
    ssh_key_source: "{{ ssh_key_source | default('/mnt/downloads/ssh/optimus-prime') }}"
    # Git forge keys are read from the CONTROLLER's ~/.ssh (the workstation running
    # ansible), never staged on the /mnt/downloads NFS share: that export is
    # all_squash to uid 1000 for the whole LAN, so file modes there protect nothing.
    controller_ssh_dir: "{{ lookup('env', 'HOME') }}/.ssh"
    git_forge_keys:
      - { dir: github/ciberkids, key: id_github }
      - { dir: gitlab/ciberkids, key: gitlab_ciberkids }
      - { dir: gitlab/work, key: gitlab_work }
    quadlets_src: "{{ playbook_dir }}/../systemd/containers/system/bumblebee"
    nfs_mounts:
      - src: "{{ nfs_server }}:/mnt/downloads"
        path: /mnt/downloads
        opts: defaults,_netdev
      - src: "{{ nfs_server }}:/mnt/data"
        path: /mnt/data
        opts: defaults,_netdev
      - src: "{{ nfs_server }}:/mnt/MovieAndTvShows"
        path: /mnt/MovieAndTvShows
        opts: defaults,_netdev
      - src: "{{ nfs_server }}:/mnt/MovieAndTvShows/Movies"
        path: /mnt/MovieAndTvShows/Movies
        opts: defaults,_netdev,ro
      - src: "{{ nfs_server }}:/mnt/MovieAndTvShows/TvShows"
        path: /mnt/MovieAndTvShows/TvShows
        opts: defaults,_netdev,ro
      - src: "{{ nfs_server }}:/mnt/data/docker_persistent/immich"
        path: /mnt/data/docker_persistent/immich
        opts: defaults,_netdev
      - src: "{{ nfs_server }}:/mnt/data/docker_persistent/nextcloud"
        path: /mnt/data/docker_persistent/nextcloud
        opts: defaults,_netdev
      - src: "{{ nfs_server }}:/mnt/data/docker_persistent/volumetest"
        path: /mnt/data/docker_persistent/volumetest
        opts: defaults,_netdev
      - src: "{{ nfs_server }}:/mnt/data/Matteo_And_Manu/Pictures"
        path: /mnt/data/Matteo_And_Manu/Pictures
        opts: defaults,_netdev,ro
    packages:
      - podman
      - samba
      - samba-client
      - nfs-utils
      - cockpit
      - cockpit-podman
      - cockpit-storaged
      - cockpit-networkmanager
      - cockpit-packagekit
      - policycoreutils-python-utils
      - fastfetch
      - btop
      - nvtop
      - epel-release
      # rsyslog-logrotate is a SEPARATE package on EL9 (it was bundled into rsyslog on
      # older RHEL). Without it logrotate has no rule for /var/log/messages, exits 0
      # daily, and rotates nothing — that is how messages reached 17 G and filled root
      # in Jul 2026. rpm -V rsyslog stays clean, so nothing warns you. Keep it listed.
      - rsyslog
      - rsyslog-logrotate
      - pigz            # parallel gzip, for archiving large logs off root

  tasks:
    # =========================================================
    # 1. Add user to sudoers (wheel group)
    # =========================================================
    - name: Add {{ target_user }} to wheel group for sudo access
      user:
        name: "{{ target_user }}"
        groups: wheel
        append: yes

    # =========================================================
    # 2. Enable cockpit
    # =========================================================
    - name: Enable and start cockpit socket
      systemd:
        name: cockpit.socket
        enabled: yes
        state: started

    # =========================================================
    # 3. Install EPEL repository
    # =========================================================
    - name: Install EPEL release
      dnf:
        name: epel-release
        state: present

    # =========================================================
    # 4. Install packages
    # =========================================================
    - name: Install required packages
      dnf:
        name: "{{ packages }}"
        state: present

    # =========================================================
    # 4b. Log rotation hardening
    #
    # /var/log/messages reached 17 G unrotated (Apr-Jul 2026) and took root to 90%.
    # The rsyslog-logrotate package (in `packages` above) supplies the missing rule;
    # these two directives bound the retained size. journald on this host is volatile,
    # so /var/log/messages is the ONLY persistent log — hence compress rather than a
    # shorter retention. See docs/bumblebee.md#logging.
    # =========================================================
    - name: Compress rotated logs (this data compresses ~25x)
      lineinfile:
        path: /etc/logrotate.conf
        regexp: '^#?compress$'
        line: compress
        insertbefore: '^include /etc/logrotate.d'

    - name: Cap log size between weekly rotations (guard against a chatty service)
      lineinfile:
        path: /etc/logrotate.conf
        regexp: '^maxsize '
        line: maxsize 500M
        insertbefore: '^include /etc/logrotate.d'

    # maxsize can rotate EARLY under a spike, and `rotate` bounds how many rotations are
    # kept — so the stock `rotate 4` would leave only days of history in exactly the
    # incident where you want it. journald here is volatile, so /var/log/messages is the
    # only persistent log. compress makes depth cheap (~11 MB/rotation), so buy more of it.
    - name: Keep 12 rotations rather than 4 (history depth; cheap once compressed)
      lineinfile:
        path: /etc/logrotate.conf
        regexp: '^rotate '
        line: rotate 12
        insertbefore: '^include /etc/logrotate.d'

    # =========================================================
    # 4c. Swap (8 G swapfile on /home)
    #
    # The installer created NO swap. On 2026-10-19 an ollama model load pushed
    # MemAvailable to 1 GB; with nothing to swap anonymous pages to, the kernel
    # thrashed page cache (executables) instead of OOM-killing, and the host
    # livelocked for 17 h — ping answered, sshd never sent a banner. Swap turns that
    # cliff into a slowdown. It lives on /home (415 G) not / (75 G, filled in Aug).
    # Low swappiness: only for spikes, not to page out idle containers.
    # =========================================================
    - name: Check for swapfile
      stat:
        path: /home/swapfile
      register: swapfile

    - name: Create swapfile (dd, not fallocate — fallocate'd files can have holes swapon rejects)
      command: dd if=/dev/zero of=/home/swapfile bs=1M count=8192
      when: not swapfile.stat.exists

    - name: Restrict swapfile permissions
      file:
        path: /home/swapfile
        mode: "0600"
        owner: root
        group: root

    # Without swapfile_t, SELinux denies swapon on a file under /home (home_root_t).
    - name: Label swapfile swapfile_t (persistent)
      command: semanage fcontext -a -t swapfile_t /home/swapfile
      register: swap_fcontext
      failed_when: swap_fcontext.rc != 0 and 'already defined' not in swap_fcontext.stderr
      changed_when: swap_fcontext.rc == 0

    - name: Apply swapfile label
      command: restorecon -v /home/swapfile
      register: swap_restorecon
      changed_when: swap_restorecon.stdout != ""

    - name: Format swapfile
      command: mkswap /home/swapfile
      when: not swapfile.stat.exists

    - name: Add swapfile to fstab
      lineinfile:
        path: /etc/fstab
        regexp: '^/home/swapfile\s'
        line: /home/swapfile none swap defaults 0 0

    - name: Enable swap
      command: swapon /home/swapfile
      register: swap_on
      failed_when: swap_on.rc != 0 and 'Device or resource busy' not in swap_on.stderr
      changed_when: swap_on.rc == 0

    - name: Low swappiness (swap is for spikes only)
      copy:
        dest: /etc/sysctl.d/90-swappiness.conf
        content: "vm.swappiness = 10\n"
        mode: "0644"
      register: swappiness

    - name: Apply swappiness
      command: sysctl -p /etc/sysctl.d/90-swappiness.conf
      when: swappiness.changed

    # =========================================================
    # 5. NVIDIA driver (580 legacy for GTX 1080 Ti)
    # =========================================================
    - name: Add NVIDIA CUDA repository
      yum_repository:
        name: cuda-rhel9
        description: NVIDIA CUDA repository for RHEL 9
        baseurl: https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/
        gpgcheck: yes
        gpgkey: https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/D42D0685.pub
        enabled: yes

    - name: Install NVIDIA 580 legacy DKMS driver
      dnf:
        name: "@nvidia-driver:580-dkms"
        state: present
      notify: reboot required

    - name: Install dnf post-transaction-actions plugin
      dnf:
        name: python3-dnf-plugin-post-transaction-actions
        state: present

    - name: Deploy nvidia-reboot script
      copy:
        src: "{{ playbook_dir }}/../scripts/bumblebee/nvidia-reboot.sh"
        dest: /usr/local/sbin/nvidia-reboot.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy nvidia-reboot DNF action
      copy:
        src: "{{ playbook_dir }}/../config/dnf/nvidia-reboot.action"
        dest: /etc/dnf/plugins/post-transaction-actions.d/nvidia-reboot.action
        owner: root
        group: root
        mode: "0644"

    # =========================================================
    # 5a. Unattended updates (dnf-automatic)
    #
    # dnf-automatic-install.timer installs updates every night at 03:00 (drop-in) and
    # automatic.conf has reboot = when-needed, so the host reboots itself after kernel
    # or core-library updates ("shutdown -r +5"). Every bumblebee service is down for a
    # minute or two around 03:05 on those nights; that is by design. apply_updates=no in
    # automatic.conf does not matter: the -install timer variant forces installation.
    # Captured from the live host 2026-11-12, where all of this had been set up by hand.
    # =========================================================
    - name: Install dnf-automatic
      dnf:
        name: dnf-automatic
        state: present

    - name: Deploy dnf-automatic configuration
      copy:
        src: "{{ playbook_dir }}/../config/dnf/automatic.conf"
        dest: /etc/dnf/automatic.conf
        owner: root
        group: root
        mode: "0644"

    - name: Create dnf-automatic-install timer drop-in directory
      file:
        path: /etc/systemd/system/dnf-automatic-install.timer.d
        state: directory
        mode: "0755"

    - name: Run dnf-automatic-install at 03:00
      copy:
        src: "{{ playbook_dir }}/../systemd/system/bumblebee/dnf-automatic-install-time.conf"
        dest: /etc/systemd/system/dnf-automatic-install.timer.d/time.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload systemd

    - name: Enable unattended update timer
      systemd:
        name: dnf-automatic-install.timer
        daemon_reload: yes
        enabled: yes
        state: started

    # =========================================================
    # 6. NFS mounts
    # =========================================================
    - name: Create NFS mount directories
      file:
        path: "{{ item.path }}"
        state: directory
        mode: "0755"
      loop: "{{ nfs_mounts }}"

    - name: Mount NFS shares and add to fstab
      mount:
        src: "{{ item.src }}"
        path: "{{ item.path }}"
        fstype: nfs
        opts: "{{ item.opts }}"
        state: mounted
      loop: "{{ nfs_mounts }}"

    # =========================================================
    # 7. SSH keys setup
    # =========================================================
    - name: Create .ssh directory for {{ target_user }}
      file:
        path: "/home/{{ target_user }}/.ssh"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0700"

    - name: Copy SSH private key
      copy:
        src: "{{ ssh_key_source }}/optimusprime_id_rsa"
        dest: "/home/{{ target_user }}/.ssh/id_rsa"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"
        remote_src: yes

    - name: Copy SSH public key
      copy:
        src: "{{ ssh_key_source }}/optimusprime_id_rsa.pub"
        dest: "/home/{{ target_user }}/.ssh/id_rsa.pub"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0644"
        remote_src: yes

    - name: Add public key to authorized_keys
      authorized_key:
        user: "{{ target_user }}"
        key: "{{ lookup('file', ssh_key_source + '/optimusprime_id_rsa.pub') }}"
        state: present

    # Clone over SSH from GitHub (ciberkids) and GitLab (personal @matteofavaro,
    # work @matteohexagon) with the same per-account aliases as the workstation:
    #   git clone git@github.com-personal:ciberkids/<repo>.git
    #   git clone git@gitlab.com-personal:<group>/<repo>.git
    #   git clone git@gitlab.com-work:<group>/<repo>.git
    - name: Create Git forge SSH key directories
      file:
        path: "/home/{{ target_user }}/.ssh/{{ item }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0700"
      loop: [github, github/ciberkids, gitlab, gitlab/ciberkids, gitlab/work]

    - name: Copy Git forge private keys from the controller
      copy:
        src: "{{ controller_ssh_dir }}/{{ item.dir }}/{{ item.key }}"
        dest: "/home/{{ target_user }}/.ssh/{{ item.dir }}/{{ item.key }}"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"
      loop: "{{ git_forge_keys }}"
      no_log: true

    - name: Copy Git forge public keys from the controller
      copy:
        src: "{{ controller_ssh_dir }}/{{ item.dir }}/{{ item.key }}.pub"
        dest: "/home/{{ target_user }}/.ssh/{{ item.dir }}/{{ item.key }}.pub"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0644"
      loop: "{{ git_forge_keys }}"

    - name: Write SSH config with the Git forge aliases
      copy:
        content: |
          Host github.com-personal
              HostName github.com
              User git
              IdentityFile ~/.ssh/github/ciberkids/id_github
              IdentitiesOnly yes

          Host gitlab.com-personal
              HostName gitlab.com
              User git
              IdentityFile ~/.ssh/gitlab/ciberkids/gitlab_ciberkids
              IdentitiesOnly yes

          Host gitlab.com-work
              HostName gitlab.com
              User git
              IdentityFile ~/.ssh/gitlab/work/gitlab_work
              IdentitiesOnly yes
        dest: "/home/{{ target_user }}/.ssh/config"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"

    # Host keys come from the controller's own known_hosts (already trusted there),
    # not from a fresh ssh-keyscan on the target, so a spoofed scan can't be pinned.
    - name: Add GitHub and GitLab host keys to known_hosts
      known_hosts:
        name: "{{ item }}"
        key: "{{ lookup('pipe', 'ssh-keygen -F ' + item + ' | grep -v \"^#\" | head -1') }}"
        path: "/home/{{ target_user }}/.ssh/known_hosts"
        state: present
      loop: [github.com, gitlab.com]
      become: yes
      become_user: "{{ target_user }}"

    # =========================================================
    # 7b. Projects directory
    # =========================================================
    - name: Create /home/projects directory
      file:
        path: /home/projects
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"

    - name: Set git global identity
      git_config:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        scope: global
      become: yes
      become_user: "{{ target_user }}"
      loop:
        - { name: "user.name", value: "ciberkids" }
        - { name: "user.email", value: "matteo.favaro@hexagon.com" }

    # =========================================================
    # 7c. AI coding tools for {{ target_user }} (Claude Code + herdr)
    # =========================================================
    # Both vendor installers verify a SHA-256 from their own manifest and install
    # into ~/.local/bin without root. Both tools update themselves (claude
    # auto-updates, `herdr update`), so these tasks only bootstrap a fresh host.
    # Claude Code still needs an interactive /login after install.
    - name: Install Claude Code (native installer)
      shell: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
      args:
        executable: /bin/bash
        creates: "/home/{{ target_user }}/.local/bin/claude"
      become: yes
      become_user: "{{ target_user }}"

    - name: Install herdr (terminal multiplexer for coding agents)
      shell: set -o pipefail && curl -fsSL https://herdr.dev/install.sh | sh
      args:
        executable: /bin/bash
        creates: "/home/{{ target_user }}/.local/bin/herdr"
      become: yes
      become_user: "{{ target_user }}"

    # Adds a SessionStart hook to ~/.claude/settings.json that reports the Claude
    # session id to herdr's local unix socket (no-op outside herdr panes), so
    # herdr can resume Claude sessions after its server restarts.
    - name: Install herdr's Claude Code integration
      command: "/home/{{ target_user }}/.local/bin/herdr integration install claude"
      args:
        creates: "/home/{{ target_user }}/.claude/hooks/herdr-agent-state.sh"
      become: yes
      become_user: "{{ target_user }}"

    # herdr runs as a systemd USER service (its socket and panes belong to the user).
    # Lingering starts the user manager at boot and keeps it after logout, so the
    # herdr server survives the nightly dnf-automatic reboots and SSH disconnects.
    - name: Enable lingering for {{ target_user }}
      command: "loginctl enable-linger {{ target_user }}"
      args:
        creates: "/var/lib/systemd/linger/{{ target_user }}"

    - name: Look up {{ target_user }}'s uid (for the user manager's runtime dir)
      getent:
        database: passwd
        key: "{{ target_user }}"

    - name: Create the user systemd unit directory
      file:
        path: "/home/{{ target_user }}/.config/systemd/user"
        state: directory
        mode: "0755"
      become: yes
      become_user: "{{ target_user }}"

    - name: Deploy herdr user service
      copy:
        src: "{{ playbook_dir }}/../systemd/user/bumblebee/herdr.service"
        dest: "/home/{{ target_user }}/.config/systemd/user/herdr.service"
        mode: "0644"
      become: yes
      become_user: "{{ target_user }}"

    - name: Enable and start herdr user service
      systemd:
        name: herdr.service
        scope: user
        enabled: yes
        state: started
        daemon_reload: yes
      become: yes
      become_user: "{{ target_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[target_user][1] }}"

    # =========================================================
    # 8. Fastfetch for all users on login
    # =========================================================
    - name: Enable fastfetch on login for all users
      copy:
        content: "fastfetch\n"
        dest: /etc/profile.d/fastfetch.sh
        mode: "0755"

    # =========================================================
    # 9. Telegram notifications (telegram-send)
    # =========================================================
    - name: Install telegram-send dependencies
      pip:
        name:
          - python-telegram-bot==21.10
          - httpx==0.28.1
          - telegram-send
        state: present
        executable: pip3

    # Must live in /usr/local/bin, not /home/matteo: SELinux is enforcing and
    # /home/matteo is labelled container_file_t, which systemd's init_t cannot
    # execute — the unit failed 203/EXEC on every invocation until 2026-08-05, so
    # no failure alert had ever been delivered. /usr/local/bin gets bin_t.
    - name: Deploy notify-failure script
      copy:
        src: "{{ playbook_dir }}/../scripts/bumblebee/notify-failure.sh"
        dest: /usr/local/bin/notify-failure.sh
        mode: "0755"
        owner: root
        group: root

    # notify-recovery-check sends the "service X is back" half of the alert pair. It had
    # NO ansible task at all until 2026-08-19, and its unit still pointed at
    # /home/matteo/notify-recovery-check.sh -- container_file_t, unexecutable by init_t --
    # so it failed 203/EXEC on every 5-minute run since 2026-06-19 (6,706 recorded failures)
    # and no recovery notification was ever delivered. The 2026-08-05 fix for notify-failure.sh
    # missed this sibling because it searched for "notify-failure" specifically.
    # Audit for recurrences with:  grep -H ExecStart /etc/systemd/system/*.service | grep /home/
    - name: Deploy notify-recovery-check script
      copy:
        src: "{{ playbook_dir }}/../scripts/bumblebee/notify-recovery-check.sh"
        dest: /usr/local/bin/notify-recovery-check.sh
        mode: "0755"
        owner: root
        group: root

    - name: Deploy notify-recovery-check service
      copy:
        src: "{{ quadlets_src }}/notify-recovery-check.service"
        dest: /etc/systemd/system/notify-recovery-check.service
        mode: "0644"
      notify: reload systemd

    - name: Deploy notify-recovery-check timer
      copy:
        src: "{{ quadlets_src }}/notify-recovery-check.timer"
        dest: /etc/systemd/system/notify-recovery-check.timer
        mode: "0644"
      notify: reload systemd

    - name: Enable notify-recovery-check timer
      systemd:
        name: notify-recovery-check.timer
        daemon_reload: yes
        enabled: yes
        state: started

    - name: Deploy notify-failure@ template service
      copy:
        src: "{{ quadlets_src }}/notify-failure@.service"
        dest: /etc/systemd/system/notify-failure@.service
        mode: "0644"
      notify: reload systemd

    - name: Deploy notify-success@ template service
      copy:
        src: "{{ quadlets_src }}/notify-success@.service"
        dest: /etc/systemd/system/notify-success@.service
        mode: "0644"
      notify: reload systemd

    - name: Deploy reboot notification service
      copy:
        src: "{{ quadlets_src }}/notify-reboot.service"
        dest: /etc/systemd/system/notify-reboot.service
        mode: "0644"
      notify: reload systemd

    - name: Enable reboot notification service
      systemd:
        name: notify-reboot.service
        daemon_reload: yes
        enabled: yes

    # The service's ExecStart; without it the nightly auto-update fails with 203/EXEC.
    - name: Deploy podman auto-update notification script
      copy:
        src: "{{ playbook_dir }}/../scripts/bumblebee/podman-update-notify.sh"
        dest: /usr/local/bin/podman-update-notify.sh
        mode: "0755"
        owner: root
        group: root

    - name: Deploy podman auto-update notification service
      copy:
        src: "{{ quadlets_src }}/podman-auto-update-notify.service"
        dest: /etc/systemd/system/podman-auto-update-notify.service
        mode: "0644"
      notify: reload systemd

    - name: Deploy podman auto-update notification timer
      copy:
        src: "{{ quadlets_src }}/podman-auto-update-notify.timer"
        dest: /etc/systemd/system/podman-auto-update-notify.timer
        mode: "0644"
      notify: reload systemd

    - name: Enable podman auto-update notification timer
      systemd:
        name: podman-auto-update-notify.timer
        daemon_reload: yes
        enabled: yes
        state: started

    # Cross-host dead-man's-switch for Optimus Prime's monitoring stack. Lives on
    # bumblebee on purpose: a monitor must not share a fate with what it watches, and
    # Prometheus/Alertmanager/HA all run on OP. Added 2026-08-15 after four services
    # were found unreachable for ~4 months — the probes and alert rule worked the whole
    # time, but Alertmanager's Telegram token was revoked (401) so nothing was delivered,
    # a failure visible only in Alertmanager's own logs.
    # Same /usr/local/bin + bin_t requirement as notify-failure.sh above.
    - name: Deploy monitoring watchdog script
      copy:
        src: "{{ playbook_dir }}/../scripts/bumblebee/monitoring-watchdog.py"
        dest: /usr/local/bin/monitoring-watchdog.py
        mode: "0755"
        owner: root
        group: root

    - name: Deploy monitoring watchdog service
      copy:
        src: "{{ playbook_dir }}/../systemd/units/bumblebee/monitoring-watchdog.service"
        dest: /etc/systemd/system/monitoring-watchdog.service
        mode: "0644"
      notify: reload systemd

    - name: Deploy monitoring watchdog timer
      copy:
        src: "{{ playbook_dir }}/../systemd/units/bumblebee/monitoring-watchdog.timer"
        dest: /etc/systemd/system/monitoring-watchdog.timer
        mode: "0644"
      notify: reload systemd

    # NOTE: /etc/monitoring-watchdog.env (HA_WEBHOOK_ID) is deliberately NOT managed here —
    # it holds the HA webhook shared secret and must stay out of git. Create it manually:
    #   printf 'HA_WEBHOOK_ID=<id>\n' | sudo tee /etc/monitoring-watchdog.env
    #   sudo chown root:root /etc/monitoring-watchdog.env && sudo chmod 600 /etc/monitoring-watchdog.env
    # The id must match the webhook trigger in HA's
    # "Monitoring watchdog alert (from Bumblebee)" automation.
    - name: Enable monitoring watchdog timer
      systemd:
        name: monitoring-watchdog.timer
        daemon_reload: yes
        enabled: yes
        state: started

    # NVIDIA GPU metrics for Prometheus: nvidia-smi -> /tmp/node_exporter/nvidia_gpu.prom,
    # read by node-exporter's textfile collector every 15 s. Feeds the Grafana dashboard
    # "NVIDIA GPU - Bumblebee (GTX 1080 Ti)". If nvidia-smi fails the script keeps the OLD
    # file, so node_exporter serves frozen values; the dashboard's Metrics Age tile is the
    # detector. /tmp/node_exporter itself comes from the tmpfiles rule below (also used by
    # the podman container metrics), without it the collector has nowhere to write after
    # a reboot. Same /usr/local/bin + bin_t requirement as notify-failure.sh above.
    - name: Deploy node_exporter textfile directory rule
      copy:
        src: "{{ playbook_dir }}/../systemd/units/bumblebee/node-exporter-tmpdir.conf"
        dest: /etc/tmpfiles.d/node-exporter-tmpdir.conf
        mode: "0644"
        owner: root
        group: root

    - name: Create node_exporter textfile directory now
      command: systemd-tmpfiles --create /etc/tmpfiles.d/node-exporter-tmpdir.conf
      changed_when: false

    - name: Deploy NVIDIA GPU metrics script
      copy:
        src: "{{ playbook_dir }}/../scripts/bumblebee/nvidia-gpu-metrics.sh"
        dest: /usr/local/bin/nvidia-gpu-metrics.sh
        mode: "0755"
        owner: root
        group: root

    - name: Deploy NVIDIA GPU metrics service
      copy:
        src: "{{ playbook_dir }}/../systemd/units/bumblebee/nvidia-gpu-metrics.service"
        dest: /etc/systemd/system/nvidia-gpu-metrics.service
        mode: "0644"
      notify: reload systemd

    - name: Deploy NVIDIA GPU metrics timer
      copy:
        src: "{{ playbook_dir }}/../systemd/units/bumblebee/nvidia-gpu-metrics.timer"
        dest: /etc/systemd/system/nvidia-gpu-metrics.timer
        mode: "0644"
      notify: reload systemd

    - name: Enable NVIDIA GPU metrics timer
      systemd:
        name: nvidia-gpu-metrics.timer
        daemon_reload: yes
        enabled: yes
        state: started

    # Per-container running state (podman_container_running{name,server}) written to the
    # same textfile directory every 60 s. Deployed because it is live, but as of
    # 2026-11-12 NO dashboard or alert rule queries it: the dashboards use
    # podman-exporter's podman_container_state. Candidate for removal. The script writes
    # the .prom file in place (not via temp + mv), so a scrape can catch it half-written.
    - name: Deploy podman container metrics script
      copy:
        src: "{{ playbook_dir }}/../scripts/bumblebee/update-podman-metrics.sh"
        dest: /usr/local/bin/update-podman-metrics.sh
        mode: "0755"
        owner: root
        group: root

    - name: Deploy podman container metrics service and timer
      copy:
        src: "{{ playbook_dir }}/../systemd/units/bumblebee/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - update-podman-metrics.service
        - update-podman-metrics.timer
      notify: reload systemd

    - name: Enable podman container metrics timer
      systemd:
        name: update-podman-metrics.timer
        daemon_reload: yes
        enabled: yes
        state: started

    # Quiet the podman REST API access log. Traefik's container-discovery provider
    # polls this API ~9.5 req/s and the packaged unit ships --log-level=info, which
    # logs every request to syslog (~180 MB/day, 92% of a 17 G /var/log/messages in
    # Jul 2026). A drop-in survives podman package updates; editing the vendor unit
    # in /usr/lib/systemd/system would not.
    - name: Create podman.service drop-in directory
      file:
        path: /etc/systemd/system/podman.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy podman API log-level drop-in
      copy:
        src: "{{ playbook_dir }}/../systemd/system/bumblebee/podman-log-level.conf"
        dest: /etc/systemd/system/podman.service.d/log-level.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload systemd

    # netavark adds podman subnets (10.88.0.0/16, 10.89.0.0/24) to firewalld's
    # trusted zone at RUNTIME only. Any `firewall-cmd --reload` wipes them, e.g.
    # the cockpit-ws RPM %post scriptlet run by dnf-automatic. Container->host
    # traffic then falls into the public zone, which rejects aardvark DNS (:53),
    # so every multi-container .network stack loses name resolution. Paperless
    # was down 2026-11-05 03:15-09:27 for this reason. This upstream unit listens
    # for firewalld reloads and re-applies netavark's rules. Do NOT switch to
    # firewall_driver=firewalld instead: it breaks host-IP access to forwarded ports.
    - name: Re-apply netavark firewall rules after every firewalld reload
      systemd:
        name: netavark-firewalld-reload.service
        enabled: yes
        state: started

    # =========================================================
    # 9a. logrotate rule for cloud-drive-sync's own log
    #
    # The app writes its own log with no rotation and no size cap; on this host it reached
    # 4.6 GB (334k lines averaging ~440 KB each) because failed WebDAV actions log the whole
    # request payload -- ciberkids/cloud-drive-sync#48. copytruncate is REQUIRED: the daemon
    # holds the log fd for its whole lifetime with no SIGHUP reopen, so a rename-based
    # rotation would leave it writing to the renamed inode forever.
    # =========================================================
    - name: Deploy logrotate rule for cloud-drive-sync
      copy:
        src: "{{ playbook_dir }}/../config/logrotate/bumblebee/cloud-drive-sync"
        dest: /etc/logrotate.d/cloud-drive-sync
        owner: root
        group: root
        mode: "0644"

    # =========================================================
    # 9b. Image pruning (two cadences, deliberately)
    #
    # daily   podman-prune.sh (06:00)    -> dangling images + stopped containers, guarded.
    #                                       Cleans up after the nightly auto-update. Shared
    #                                       with Optimus Prime: units in systemd/common/,
    #                                       script in scripts/common/ (commit 6d2b927).
    #                                       The old weekly plain `podman system prune -f`
    #                                       units in systemd/system/bumblebee/ are stale:
    #                                       until 2026-11-12 this playbook deployed THOSE,
    #                                       so a run silently downgraded the live prune.
    # monthly `podman image prune -a -f` -> tagged-but-unused images. system prune never
    #                                       touches these, which let ~5 G of GitLab CI
    #                                       images accumulate (oldest 13 months) by Jul 2026.
    #
    # Monthly rather than weekly because -a evicts CI base images and the next pipeline
    # re-pulls them. Do NOT "soften" it with --filter until=<age>: that filter matches the
    # image's upstream BUILD date, not pull or last-used time, so it spares nothing useful
    # (verified 2026-07-27). Cadence is the only honest lever.
    #
    # 2026-08-05: `-a` is unrecoverable for locally-built localhost/* images (no registry
    # to re-pull from). Two defects let it delete localhost/hermes-agent:latest and keep
    # Hermes down 4 days: (1) the timers carried Requires=<service> in [Unit], which starts
    # the service on every boot and daemon-reload, ignoring OnCalendar — the "monthly" job
    # ran 6x in 10 days; (2) a boot-time run lands BEFORE container units start, so every
    # image looks unused. Both fixed in the .timer files. Hermes remains the only
    # locally-built image here — pushing it to ghcr.io would remove the class of risk.
    # =========================================================
    - name: Deploy podman prune script
      copy:
        src: "{{ playbook_dir }}/../scripts/common/podman-prune.sh"
        dest: /usr/local/bin/podman-prune.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy daily podman prune units (shared with Optimus Prime)
      copy:
        src: "{{ playbook_dir }}/../systemd/common/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - podman-prune.service
        - podman-prune.timer
      notify: reload systemd

    - name: Deploy monthly podman image prune units
      copy:
        src: "{{ playbook_dir }}/../systemd/system/bumblebee/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - podman-image-prune.service
        - podman-image-prune.timer
      notify: reload systemd

    - name: Enable podman prune timers
      systemd:
        name: "{{ item }}"
        daemon_reload: yes
        enabled: yes
        state: started
      loop:
        - podman-prune.timer
        - podman-image-prune.timer

    # =========================================================
    # 9c. Persistent journald
    #
    # This host shipped volatile (no /var/log/journal), so journalctl only ever showed the
    # current boot. That is why a 17 G unrotated /var/log/messages was the only history.
    # The size caps matter: journald defaults SystemMaxUse to 10% of the fs (~7 G here).
    #
    # The rsyslog drop-in is not optional. On EL9 rsyslog reads system messages from
    # journald via imjournal, tracking position in a state file. If journald restarts, that
    # cursor goes stale and rsyslog silently stops writing /var/log/messages while staying
    # active and exit-0. PartOf= makes rsyslog restart whenever journald does.
    # =========================================================
    - name: Create drop-in directories for journald and rsyslog
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/systemd/journald.conf.d
        - /etc/systemd/system/rsyslog.service.d

    - name: Deploy journald persistence drop-in
      copy:
        src: "{{ playbook_dir }}/../systemd/system/bumblebee/journald-persistent.conf"
        dest: /etc/systemd/journald.conf.d/persistent.conf
        owner: root
        group: root
        mode: "0644"
      register: journald_conf

    - name: Deploy rsyslog follow-journald drop-in
      copy:
        src: "{{ playbook_dir }}/../systemd/system/bumblebee/rsyslog-follow-journald.conf"
        dest: /etc/systemd/system/rsyslog.service.d/follow-journald.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload systemd

    - name: Create the journal directory (its existence is what enables persistence)
      file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: "2755"

    - name: Apply journal directory ACLs (journald needs these for non-root reads)
      command: systemd-tmpfiles --create --prefix /var/log/journal
      changed_when: false

    - name: Restart journald then rsyslog when journald config changed
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - systemd-journald
        - rsyslog
      when: journald_conf.changed

