# ============================================================================
#  LIGHT OUTLET  ->  HOME ASSISTANT ENTITY  BINDING
# ============================================================================
#
#  Fill in `entity:` for each outlet, then hand this file back. That is the
#  only field to edit — everything else is context.
#
#  READING AN ENTRY
#    - {i: 19, xy: [7.6, 6.8], type: recessed, entity: ~}
#      i      = the NUMBER printed on the overlay PNG for this floor
#      xy     = metres from that floor's south-west corner (x east, y north)
#      type   = recessed (double ring on the plan) / surface (single ring)
#      entity = what to control.  <-- THE ONLY FIELD TO EDIT
#
#  Outlets are grouped into lettered CLUSTERS by physical proximity. The same
#  letters are drawn on the overlay PNGs, so cluster D in this file is the
#  group marked D on the image. Clusters usually correspond to one switch.
#
#  RULES
#    * Several outlets SHARING one entity is normal — a 6-lamp ceiling grid on
#      one switch is simply the same entity six times. Whole clusters often
#      take a single entity; write it on each line.
#    * Don't know / nothing connected / not in HA  ->  leave `entity: ~`
#      Those become dim passive dots on the plan, not broken buttons.
#    * `entity: skip` drops the outlet from the floorplan entirely.
#
#  WORTH KNOWING
#    (switch) = wall switch presented as a light: ON/OFF only, cannot dim.
#    (bulb)   = real Zigbee bulb, can dim and take colour.
#    (group)  = controls a whole room at once — usually the right answer when
#               several outlets sit on one physical switch.
#
#  I have NOT guessed which room each outlet is in. Two automated attempts
#  (nearest-label, and flood-filling the walls) both produced nonsense, and a
#  confident-looking wrong default is worse than a blank. You have the overlay
#  image and you know the house — see scripts/floorplan/README.md for why.
#

