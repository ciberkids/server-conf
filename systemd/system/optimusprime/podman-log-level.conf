# Silence the podman REST API access log.
#
# Traefik's container-discovery provider polls this API constantly, and at the packaged
# --log-level=info podman logs EVERY request. Measured on Optimus Prime 2026-08-19, before
# this drop-in existed:
#
#   journal entries, 1 h sample:   253,734   => 6.1 M/day
#      of which podman.service:    239,158   => 5.7 M/day  = 94% of the ENTIRE journal
#
# Each line looks like:
#   podman[3349]: @ - - [...] "GET /v1.44/containers/<id>/json HTTP/1.1" 200 7364
#
# Unlike bumblebee (where the same fault produced a 17 G unrotated /var/log/messages in
# July 2026), Arch has no rsyslog here, so it all lands in journald -- which self-caps at
# the default SystemMaxUse of ~4 G. So this was never a disk risk on OP. The costs were:
# journal retention squeezed to ~23 days when the same 4 G buys roughly a year of real
# logs, and `journalctl --since "24 hours ago"` timing out after 2 minutes at ~70
# entries/second. That retention window is what nearly lost the Aug 13 coordinator-wedge
# evidence.
#
# warn keeps warnings/errors. To get the access log back for debugging Traefik <-> podman
# container discovery, comment the line below, then:
#   systemctl daemon-reload && systemctl stop podman.service   (podman.socket re-activates it)
#
# !! ALWAYS restart traefik.service afterwards. Cycling podman kills Traefik's event
# !! stream; it keeps serving its existing routing table so everything LOOKS fine, but it
# !! stops learning about container changes and a later container restart 502s. Verify by
# !! probing the routed hostnames end-to-end -- router count is NOT a valid check.
[Service]
Environment=LOGGING="--log-level=warn"
