# Silence the podman REST API access log.
#
# Traefik's container-discovery provider polls this API ~9.5 req/s; at the packaged
# --log-level=info podman logs EVERY request to syslog. That was ~92% of a 17G
# /var/log/messages (Apr-Jul 2026) and ~180 MB/day of pure noise.
#
# warn keeps warnings/errors. To get the access log back for debugging Traefik <-> podman
# container discovery, comment the line below, then:
#   systemctl daemon-reload && systemctl stop podman.service   (socket re-activates it)
[Service]
Environment=LOGGING="--log-level=warn"
