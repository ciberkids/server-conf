# Restart rsyslog whenever journald restarts (2026-07-27).
#
# On EL9 rsyslog does not read /dev/log for system messages -- it pulls them from
# journald via imjournal, tracking its position in /var/lib/rsyslog/imjournal.state.
# If journald restarts, that cursor goes stale: rsyslog logs "journal files changed,
# reloading..." and then writes NOTHING further, while staying active and exit-0.
# /var/log/messages silently flatlines. Observed exactly this on 2026-07-27 when
# switching journald from volatile to persistent storage.
#
# PartOf makes systemd restart rsyslog automatically whenever journald is restarted.
[Unit]
After=systemd-journald.service
PartOf=systemd-journald.service
