# Make journald persistent across reboots (2026-07-27).
#
# This host ran volatile (no /var/log/journal), so `journalctl` only ever showed the
# current boot and everything was lost on reboot. That made rsyslog /var/log/messages
# the only persistent log -- which is how a 17G unrotated file went unnoticed.
#
# The caps are the important part: journald defaults SystemMaxUse to 10% of the
# filesystem, which is ~7G on this 70G root. Explicit limits instead.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=2G
SystemKeepFree=2G
SystemMaxFileSize=128M
# Keep at most ~3 months; bounded by SystemMaxUse whichever hits first.
MaxRetentionSec=3month
