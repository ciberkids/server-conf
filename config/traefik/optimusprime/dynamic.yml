# Dynamic configuration for services not managed by Docker labels
# (e.g., Cockpit running on the host, or pod-based containers)

http:
  routers:
    # --- *.optimusprime is LAN/VPN only (2026-11-12) ----------------------------
    # WAN :443 is forwarded to this Traefik for the *.public names, and one
    # entrypoint serves every hostname, so this guard keeps *.optimusprime to the
    # ranges below. It matches any *.optimusprime host requested from a client
    # OUTSIDE them and answers 403 via deny-all, at a priority above every other
    # router; allowed clients never match it and fall through to the real routers.
    # Covers docker-label and file routers alike, including future ones, with no
    # container restarts. *.public.favarohome.com is a different domain: untouched.
    # ClientIP() matches the TCP peer address, not X-Forwarded-For, so a header
    # cannot spoof it. Allowed: LAN, DM VPN client pools (WireGuard .4, OpenVPN .5,
    # One-Click .10, Teleport .3), podman networks (containers that call Traefik
    # by hostname, e.g. HA -> InfluxDB, blackbox probes), loopback.
    # Single-quoted on purpose: in a double-quoted YAML string `\.` is an invalid
    # escape and the whole file (every @file router) would fail to load.
    optimusprime-lan-only:
      rule: 'HostRegexp(`(?i)^(.+\.)?optimusprime\.favarohome\.com\.?$`) && !ClientIP(`192.168.1.0/24`) && !ClientIP(`192.168.3.0/24`) && !ClientIP(`192.168.4.0/24`) && !ClientIP(`192.168.5.0/24`) && !ClientIP(`192.168.10.0/24`) && !ClientIP(`10.88.0.0/16`) && !ClientIP(`10.89.0.0/16`) && !ClientIP(`127.0.0.0/8`)'
      priority: 100000
      entryPoints:
        - websecure
      middlewares:
        - deny-all
      service: noop@internal
      tls: {}

    cockpit:
      rule: "Host(`cockpit.optimusprime.favarohome.com`)"
      entryPoints:
        - websecure
      service: cockpit
      tls:
        certResolver: cloudflare

    immich:
      rule: "Host(`immich.optimusprime.favarohome.com`)"
      entryPoints:
        - websecure
      service: immich
      tls:
        certResolver: cloudflare

    immich-public:
      rule: "Host(`immich.public.favarohome.com`)"
      entryPoints:
        - websecure
      service: immich
      tls:
        certResolver: cloudflare

    nextcloud:
      rule: "Host(`nextcloud.optimusprime.favarohome.com`)"
      entryPoints:
        - websecure
      service: nextcloud
      tls:
        certResolver: cloudflare

    nextcloud-public:
      rule: "Host(`nextcloud.public.favarohome.com`)"
      entryPoints:
        - websecure
      service: nextcloud
      tls:
        certResolver: cloudflare

    n8n-public:
      rule: "Host(`n8n.public.favarohome.com`)"
      entryPoints:
        - websecure
      service: n8n
      tls:
        certResolver: cloudflare

    # --- Moved off Docker labels 2026-08-14 ---------------------------------
    # These containers sit on dedicated 10.89.x podman networks (needed for
    # inter-container DNS, e.g. DB_HOST=warracker-db). Traefik is on the
    # `podman` network at 10.88.0.18 and has NO route to 10.89.x, so
    # label-based discovery produced backends it could never reach:
    # connections HUNG for 20s rather than failing fast, Traefik logged
    # nothing, and its own dashboard reported every server "UP" because the
    # docker provider assumes UP with no healthcheck. The container
    # healthchecks passed too -- they curl localhost from *inside* the
    # container, so they cannot detect a reachability failure.
    # Fix: route via the already-published host ports (all verified serving).
    # The quadlets now set traefik.enable=false. Do NOT re-enable them: an
    # @docker router would collide with the @file router below on the same
    # Host() rule at equal priority, and which one wins is not deterministic.
    warracker:
      rule: "Host(`warracker.optimusprime.favarohome.com`)"
      entryPoints:
        - websecure
      service: warracker
      tls:
        certResolver: cloudflare

    firefly:
      rule: "Host(`firefly.optimusprime.favarohome.com`)"
      entryPoints:
        - websecure
      service: firefly
      tls:
        certResolver: cloudflare

    firefly-importer:
      rule: "Host(`importer.optimusprime.favarohome.com`)"
      entryPoints:
        - websecure
      service: firefly-importer
      tls:
        certResolver: cloudflare

    affine:
      rule: "Host(`affine.optimusprime.favarohome.com`)"
      entryPoints:
        - websecure
      service: affine
      tls:
        certResolver: cloudflare

    opensign:
      rule: "Host(`opensign.optimusprime.favarohome.com`)"
      entryPoints:
        - websecure
      service: opensign
      tls:
        certResolver: cloudflare

    opensign-server:
      rule: "Host(`opensign-api.optimusprime.favarohome.com`)"
      entryPoints:
        - websecure
      service: opensign-server
      tls:
        certResolver: cloudflare

  middlewares:
    # Rejects every request with 403 (no real client is 127.0.0.2). Used only by
    # optimusprime-lan-only, whose rule already selected the clients to refuse.
    deny-all:
      ipAllowList:
        sourceRange:
          - "127.0.0.2/32"

  services:
    cockpit:
      loadBalancer:
        servers:
          - url: "https://192.168.1.10:9090"
        serversTransport: insecureTransport

    immich:
      loadBalancer:
        servers:
          - url: "http://192.168.1.10:2283"
        serversTransport: immichTransport

    nextcloud:
      loadBalancer:
        servers:
          - url: "https://192.168.1.10:8443"
        serversTransport: insecureTransport

    n8n:
      loadBalancer:
        servers:
          - url: "http://192.168.1.14:5678"

    # Host-port backends for the 10.89.x-network containers (see note above).
    # Ports come from each quadlet's PublishPort= and were each probed on the
    # host before being written here: 8005->200, 8006->302, 3010->302,
    # 3001->200, 8081->200.
    warracker:
      loadBalancer:
        servers:
          - url: "http://192.168.1.10:8005"

    firefly:
      loadBalancer:
        servers:
          - url: "http://192.168.1.10:8006"

    firefly-importer:
      loadBalancer:
        servers:
          - url: "http://192.168.1.10:8007"

    affine:
      loadBalancer:
        servers:
          - url: "http://192.168.1.10:3010"

    opensign:
      loadBalancer:
        servers:
          - url: "http://192.168.1.10:3001"

    opensign-server:
      loadBalancer:
        servers:
          - url: "http://192.168.1.10:8081"

  serversTransports:
    insecureTransport:
      insecureSkipVerify: true

    immichTransport:
      forwardingTimeouts:
        dialTimeout: 60s
        responseHeaderTimeout: 600s
        idleConnTimeout: 600s
