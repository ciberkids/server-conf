# SCSI generic. Without it /dev/sg* and /sys/class/scsi_generic/ do not exist, and
# arcconf reports "Controllers found: 0" while still exiting SUCCESSFULLY -- it locates
# /sys/bus/pci/drivers/smartpqi fine, then dies opening /sys/class/scsi_generic/.
# That silent-success made the Adaptec HBA 1100-8i look unsupported for months.
# Deployed to /etc/modules-load.d/sg.conf on Optimus Prime, 2026-08-21.
sg
