global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram'

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram.token
        chat_id: 12373499
        parse_mode: 'HTML'
        message: |-
          {{ range .Alerts -}}
          {{ if eq .Status "firing" }}&#128680; <b>DOWN</b>{{ else }}&#9989; <b>RESOLVED</b>{{ end }}: {{ .Labels.instance }}
          {{ end -}}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
